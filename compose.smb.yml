# Mount with scripts/mount-smb.sh on the host first, then set MEDIA_PATH.
# docker compose -f compose.yml -f compose.smb.yml up -d --build
services:
  vloader:
    environment:
      SOURCE_MODE: mount
    volumes:
      - type: bind
        source: ${MEDIA_PATH:?Set MEDIA_PATH to the mounted SMB directory}
        target: /media
        read_only: true
        bind:
          create_host_path: false
