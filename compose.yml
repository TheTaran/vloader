name: vloader
services:
  vloader:
    build: ./vloader
    image: vloader:dev
    restart: unless-stopped
    env_file: .env
    # To use NFS/SMB, copy the chosen settings from compose-template.yml here.
    # Network mounting runs inside this image; remove the /media bind below.
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8090}:8080"
    volumes:
      - vloader-data:/data
      - ${MEDIA_PATH:-./media}:/media:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/healthz]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  vloader-data:
