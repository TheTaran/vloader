name: vloader
services:
  vloader:
    build: ./vloader
    image: vloader:dev
    restart: unless-stopped
    env_file: .env
    environment:
      LOCAL_AUTH_ENABLED: ${LOCAL_AUTH_ENABLED}
      DATA_DIR: /data/.vloader
      SOURCE_MOUNT: smb
      SMB_SERVER: ${SMB_SERVER}
      SMB_SHARE: ${SMB_SHARE}
      SMB_CREDENTIAL_USERNAME: ${SMB_CREDENTIAL_USERNAME}
      SMB_CREDENTIAL_PASSWORD: ${SMB_CREDENTIAL_PASSWORD}
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [SYS_ADMIN, SETUID, SETGID, DAC_READ_SEARCH, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true, apparmor:unconfined]
    ports:
      - "${BIND_ADDRESS}:${PORT}:8080"
    volumes:
      # Persist settings.json and catalog.json on the host.
      - /docker/vloader:/data
      # /media is mounted from SMB by the entrypoint.
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    pids_limit: 128
    mem_limit: 512m
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/healthz]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
