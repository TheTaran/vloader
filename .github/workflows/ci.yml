name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vloader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: vloader/go.mod
          cache-dependency-path: vloader/go.sum
          cache: true
      - name: Format
        run: test -z "$(gofmt -l cmd internal)"
      - run: go test -race ./...
      - run: go vet ./...
      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Compose validation
        working-directory: .
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Test release and version-check tooling
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
