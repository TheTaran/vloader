name: Check component versions

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/component-version-check.yml'
      - 'scripts/check-component-versions.py'
      - 'Dockerfile'
      - 'go.mod'

permissions:
  contents: read
  issues: write

concurrency:
  group: component-version-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check pinned component versions
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: python3 scripts/check-component-versions.py --manage-issue
