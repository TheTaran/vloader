# docker compose -f compose.yml -f compose.nfs.yml up -d --build
services:
  vloader:
    environment:
      SOURCE_MODE: mount
    volumes:
      - nfs-media:/media:ro
volumes:
  nfs-media:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NFS_SERVER:?Set NFS_SERVER},nfsvers=4,ro,soft,timeo=100
      device: ':${NFS_EXPORT:?Set NFS_EXPORT}'
