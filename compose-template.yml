name: vloader
services:
  vloader:
    build: ./vloader
    image: vloader:dev
    restart: unless-stopped
    env_file: .env
    environment:
      LOCAL_AUTH_ENABLED: ${LOCAL_AUTH_ENABLED:-true}
      DATA_DIR: /data/.vloader
    # Optional network source: copy ONE configuration below into compose.yml.
    # Remove the /media bind mount below when SOURCE_MOUNT is nfs or smb.
    # Add these common startup settings for either network source:
    # user: "0:0"
    # cap_add: [SYS_ADMIN, SETUID, SETGID]
    # Replace security_opt below with:
    # security_opt: [no-new-privileges:true, apparmor:unconfined]
    # Root is used only during mounting; the application runs as 10001:10001.
    # SYS_ADMIN allows mounting; AppArmor must allow mount on Linux hosts.
    # The host kernel must support the selected filesystem (NFSv4 or CIFS).
    #
    # NFS option (no extra service or Compose file):
    # environment:
    #   SOURCE_MOUNT: nfs
    #   NFS_SERVER: ${NFS_SERVER:?Set NFS_SERVER}
    #   NFS_EXPORT: ${NFS_EXPORT:?Set NFS_EXPORT}
    #
    # SMB option (use instead of the NFS environment above):
    # Replace cap_add with the complete SMB helper capability set:
    # cap_add: [SYS_ADMIN, SETUID, SETGID, DAC_READ_SEARCH, DAC_OVERRIDE]
    # environment:
    #   SOURCE_MOUNT: smb
    #   SMB_SERVER: ${SMB_SERVER:?Set SMB_SERVER}
    #   SMB_SHARE: ${SMB_SHARE:?Set SMB_SHARE}
    #   # Use DOMAIN\\username for domain accounts; local NAS accounts need only username.
    #   SMB_CREDENTIAL_USERNAME: ${SMB_CREDENTIAL_USERNAME:?Set SMB_CREDENTIAL_USERNAME}
    #   SMB_CREDENTIAL_PASSWORD: ${SMB_CREDENTIAL_PASSWORD:?Set SMB_CREDENTIAL_PASSWORD}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8090}:8080"
    volumes:
      # Bind this to a host directory so Settings and the catalog survive container replacement.
      - ${VLOADER_DATA_DIR:-./data}:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/healthz]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
# SMB credentials are passed as environment variables and are written only to a
# mode-0600 temporary credentials file while the SMB mount is established.
